server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Container-level health probe (compose / load balancer), never cached.
    location = /healthz {
        access_log off;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    # Vite emits content-hashed filenames under /assets, so they are immutable.
    # NOTE: a location that declares its own add_header stops inheriting the
    # server-level ones, so nosniff has to be repeated here.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # index.html must never be cached, or clients pin to a stale asset manifest.
    # `expires -1` emits Cache-Control: no-cache without using add_header, which
    # keeps the server-level security headers inherited here.
    location = /index.html {
        expires -1;
    }

    # SPA fallback for React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
