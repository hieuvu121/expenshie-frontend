# The API gateway replicas, load-balanced here. This is the only hop nginx
# balances: the gateway routes onward with lb:// URIs, so Spring Cloud
# LoadBalancer already spreads traffic across the other services via Eureka.
#
# Explicit upstreams replaced the earlier resolver + variable-proxy_pass trick,
# which round-robined over DNS but could not do connection keepalive, failover
# or passive health checks. The cost is that nginx resolves these names at boot
# and exits if none of them exist yet; `restart: unless-stopped` covers a cold
# `compose up`, where nginx retries until a gateway appears in DNS.
#
# Both names must always resolve. docker-compose.prod.yml runs two gateway
# services; docker-compose.yml (dev) runs one that carries both names as
# network aliases — so this file stays identical in dev and prod.
upstream api_gateway {
    # least_conn rather than round-robin: request cost here is uneven (JWT
    # verify plus a variable-latency downstream hop), so queue depth is a
    # better signal than request count.
    least_conn;
    server api-gateway-1:8080 max_fails=3 fail_timeout=10s;
    server api-gateway-2:8080 max_fails=3 fail_timeout=10s;

    # Upstream connection reuse. Requires `proxy_set_header Connection ""` in
    # the location block, or nginx opens a fresh socket per request regardless.
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# Separate pool for WebSocket. Upgraded connections are long-lived and must
# never be drawn from — or returned to — the keepalive pool above.
upstream api_gateway_ws {
    server api-gateway-1:8080;
    server api-gateway-2:8080;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # --- API: same-origin reverse proxy -------------------------------------
    # The browser only ever talks to this host, so nothing about the gateway's
    # address is baked into the JS bundle and no CORS preflight is involved.

    #listen to port 80, when request come and send to app/v1 -> nginx will direct to backend server
    location /app/v1/ {
        # No URI part after the upstream name, so the original request URI is
        # forwarded unchanged — same effect the old $request_uri suffix had.
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        # Clears the hop-by-hop Connection header so the upstream keepalive
        # pool is actually used. Do not copy this into the /ws block.
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Never let a client forge the identity headers the gateway injects
        # downstream from the JWT.
        proxy_set_header X-User-Id    "";
        proxy_set_header X-User-Email "";

        # Retry the other replica when one is down or returns a gateway error.
        # `non_idempotent` is deliberately absent: without it nginx will not
        # re-send a POST it already delivered, so a slow expense create cannot
        # be applied twice.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        # Tighter than the old 5s: a dead replica should be ejected quickly
        # rather than holding the client for a connect timeout before failover.
        proxy_connect_timeout 2s;
        proxy_read_timeout    60s;
    }

    # --- WebSocket (STOMP) ---------------------------------------------------
    # notification-service registers its endpoint at /ws; the gateway routes
    # /ws/** there. Needs the Upgrade/Connection headers and a long read timeout
    # or nginx will close idle sockets after 60s.
    #
    # No sticky balancing here on purpose: the gateway holds no per-socket state,
    # so either replica can carry the upgrade. The instance that *does* matter is
    # notification-service, which uses an in-memory SimpleBroker — it must stay at
    # one replica, or a Kafka event delivered to one instance cannot reach a
    # session held by another.
    location /ws {
        proxy_pass http://api_gateway_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Container-level health probe (compose / load balancer), never cached.
    location = /healthz {
        access_log off;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    # Vite emits content-hashed filenames under /assets, so they are immutable.
    # NOTE: a location that declares its own add_header stops inheriting the
    # server-level ones, so nosniff has to be repeated here.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # index.html must never be cached, or clients pin to a stale asset manifest.
    # `expires -1` emits Cache-Control: no-cache without using add_header, which
    # keeps the server-level security headers inherited here.
    location = /index.html {
        expires -1;
    }

    # SPA fallback for React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
