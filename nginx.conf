# The API gateway, resolved on the compose network. Kept in a variable with an
# explicit resolver so nginx does NOT fail to start when api-gateway is not up
# yet — with a literal hostname in proxy_pass, nginx resolves at boot and exits
# if the name is missing.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    set $api_gateway "http://api-gateway:8080";

    # --- API: same-origin reverse proxy -------------------------------------
    # The browser only ever talks to this host, so nothing about the gateway's
    # address is baked into the JS bundle and no CORS preflight is involved.

    #listen to port 80, when request come and send to app/v1 -> nginx will direct to backend server
    location /app/v1/ {
        proxy_pass $api_gateway$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Never let a client forge the identity headers the gateway injects
        # downstream from the JWT.
        proxy_set_header X-User-Id    "";
        proxy_set_header X-User-Email "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # --- WebSocket (STOMP) ---------------------------------------------------
    # notification-service registers its endpoint at /ws; the gateway routes
    # /ws/** there. Needs the Upgrade/Connection headers and a long read timeout
    # or nginx will close idle sockets after 60s.
    location /ws {
        proxy_pass $api_gateway$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Container-level health probe (compose / load balancer), never cached.
    location = /healthz {
        access_log off;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    # Vite emits content-hashed filenames under /assets, so they are immutable.
    # NOTE: a location that declares its own add_header stops inheriting the
    # server-level ones, so nosniff has to be repeated here.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # index.html must never be cached, or clients pin to a stale asset manifest.
    # `expires -1` emits Cache-Control: no-cache without using add_header, which
    # keeps the server-level security headers inherited here.
    location = /index.html {
        expires -1;
    }

    # SPA fallback for React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
